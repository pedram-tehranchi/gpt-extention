<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPT Extension — Settings</title>
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="options">
      <h1>Settings</h1>
      <p class="subtitle">Manage templates and extension preferences.</p>

      <section class="section">
        <h2>Title display</h2>
        <label class="field">
          <span class="field__label">Prefix to remove from tab title</span>
          <input id="title-prefix" type="text" class="field__input" />
        </label>
        <button id="save-settings" type="button">Save settings</button>
        <p id="settings-status" class="status" hidden></p>
      </section>

      <section class="section">
        <h2>Templates</h2>
        <p class="subtitle">Type <code>//</code> in ChatGPT to pick a template by name.</p>

        <form id="template-form" class="template-form">
          <input type="hidden" id="template-id" />
          <label class="field">
            <span class="field__label">Name</span>
            <input id="template-name" type="text" class="field__input" required />
          </label>
          <label class="field">
            <span class="field__label">Content</span>
            <textarea id="template-content" class="field__textarea" rows="5" required></textarea>
          </label>
          <div class="form-actions">
            <button type="submit" id="template-submit">Add template</button>
            <button type="button" id="template-cancel" hidden>Cancel edit</button>
          </div>
        </form>

        <ul id="template-list" class="template-list"></ul>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
