<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPT Extension</title>
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1>GPT Extension</h1>
        <p class="subtitle">ChatGPT title, templates, Auto Allow, and memory.</p>
      </header>

      <p id="status" class="status">Checking connection…</p>

      <section class="panel" aria-label="Quick settings">
        <label class="toggle-row">
          <span class="toggle-row__label">Auto Allow</span>
          <input id="auto-allow" type="checkbox" class="toggle-row__input" />
        </label>
        <div class="panel__group" role="group" aria-label="Conversation memory">
          <label class="toggle-row">
            <span class="toggle-row__label">Prune old messages</span>
            <input id="prune-enabled" type="checkbox" class="toggle-row__input" />
          </label>
          <div class="panel__field" id="keep-latest-field">
            <span class="field__label" id="keep-latest-label">Keep latest turns</span>
            <div class="field__row">
              <input
                id="keep-latest"
                type="number"
                class="field__input"
                min="2"
                max="200"
                step="1"
                aria-labelledby="keep-latest-label"
              />
              <button id="apply-keep" type="button" class="button-secondary">Apply</button>
            </div>
            <p class="field__hint">Applies and reloads open ChatGPT tabs.</p>
          </div>
        </div>
      </section>

      <p id="template-count" class="meta">Templates: …</p>

      <div class="popup__actions">
        <button id="open-options" type="button">Open settings</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
